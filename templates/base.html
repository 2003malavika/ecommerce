<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Product Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">Product Management</a>
        <div>
            <a class="nav-link d-inline-block" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link d-inline-block" href="{% url 'product_list' %}">Products</a>
            <a class="nav-link d-inline-block" href="{% url 'product_add' %}">Add Product</a>
            <a class="nav-link d-inline-block" href="{% url 'logout' %}">Logout</a>
        </div>
    </div>
</nav>
{% endif %}

{% block content %}{% endblock %}

</body>
</html>
